[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-optimizer"
version = "0.1.0"
description = "ASTRO: Anchored Spectral Trust-Region Optimizer, with a fair-comparison benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
# Only needed to re-fit the dead-zone spectral filter coefficients.
design = ["numpy>=1.26", "scipy>=1.11"]
# Only needed to rebuild docs/paper/paper.pdf.
paper = ["markdown>=3.5"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
