name: import-source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import complete source astro tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch claude/ai-optimization-algorithm-eb2jh9 https://github.com/pop123-ux/knsa-knee-normality-kaggle.git /tmp/src
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/src/astro/. .
          rm -rf /tmp/src
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Import complete ASTRO project from source' || exit 0
          git rm .github/workflows/import-source.yml || true
          git commit -m 'Remove temporary import workflow' || true
          git push origin HEAD:main
