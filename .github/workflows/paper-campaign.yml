name: Paper campaign checks

on:
  push:
    branches: [paper-proof-campaign]
    paths:
      - "src/astro/**"
      - "scripts/__init__.py"
      - "scripts/astro_lab.py"
      - "scripts/paper_campaign.py"
      - "scripts/paper_mechanism.py"
      - "scripts/paper_transfer.py"
      - "scripts/paper_collect.py"
      - "scripts/paper_plot.py"
      - "scripts/prepare_paper_data.py"
      - "scripts/paper_audit.py"
      - "scripts/novelty_gate.py"
      - "scripts/figures/paper_style.py"
      - "scripts/figures/fig_paper_*.py"
      - "scripts/figures/make_all.py"
      - "tests/**"
      - "pyproject.toml"
      - "docs/PAPER_PROOF_CAMPAIGN.md"
      - "docs/PRIOR_ART_2026_AUDIT.md"
      - ".github/workflows/paper-campaign.yml"
  pull_request:
    paths:
      - "src/astro/**"
      - "scripts/__init__.py"
      - "scripts/astro_lab.py"
      - "scripts/paper_campaign.py"
      - "scripts/paper_mechanism.py"
      - "scripts/paper_transfer.py"
      - "scripts/paper_collect.py"
      - "scripts/paper_plot.py"
      - "scripts/prepare_paper_data.py"
      - "scripts/paper_audit.py"
      - "scripts/novelty_gate.py"
      - "scripts/figures/paper_style.py"
      - "scripts/figures/fig_paper_*.py"
      - "scripts/figures/make_all.py"
      - "tests/**"
      - "pyproject.toml"
      - "docs/PAPER_PROOF_CAMPAIGN.md"
      - "docs/PRIOR_ART_2026_AUDIT.md"
      - ".github/workflows/paper-campaign.yml"

jobs:
  campaign-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers datasets pytest matplotlib numpy
          pip install -e .
      - name: Syntax check
        run: |
          python -m py_compile \
            src/astro/__init__.py \
            src/astro/optimizer.py \
            src/astro/polar.py \
            src/astro/routing.py \
            scripts/__init__.py \
            scripts/astro_lab.py \
            scripts/paper_campaign.py \
            scripts/paper_mechanism.py \
            scripts/paper_transfer.py \
            scripts/paper_collect.py \
            scripts/paper_plot.py \
            scripts/prepare_paper_data.py \
            scripts/paper_audit.py \
            scripts/novelty_gate.py \
            scripts/figures/paper_style.py \
            scripts/figures/fig_paper_main.py \
            scripts/figures/fig_paper_ablation.py \
            scripts/figures/fig_paper_scale.py \
            scripts/figures/fig_paper_horizon.py \
            scripts/figures/make_all.py \
            tests/test_paper_campaign.py \
            tests/test_paper_mechanism.py
      - name: Full repository test suite
        run: pytest -q
      - name: Campaign fairness and mechanism tests
        run: pytest tests/test_paper_campaign.py tests/test_paper_mechanism.py -q
      - name: Structural prior-art gate
        run: python scripts/novelty_gate.py
      - name: Registry smoke test
        run: python scripts/paper_campaign.py --mode components > /tmp/components.txt
      - name: Plotting CLI smoke tests
        run: |
          python scripts/paper_plot.py --help > /tmp/paper_plot_help.txt
          python scripts/figures/make_all.py --paper
