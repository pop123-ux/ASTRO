name: Paper checks

on:
  push:
    paths:
      - ".github/workflows/paper.yml"
      - "artifacts/**"
      - "docs/paper/**"
      - "docs/FIGURES.md"
      - "docs/PAPER_WORKFLOW.md"
      - "scripts/**"
      - "tests/test_paper_figures.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/paper.yml"
      - "artifacts/**"
      - "docs/paper/**"
      - "scripts/**"
      - "tests/test_paper_figures.py"
      - "pyproject.toml"

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight paper test dependencies
        run: pip install pytest matplotlib numpy
      - name: Syntax check
        run: python -m compileall -q scripts tests
      - name: Paper-facing tests
        run: pytest tests/test_paper_figures.py
      - name: Render current ASTRO-v2 figures
        run: >-
          python scripts/figures/make_all.py --only
          optimizer_journey paired_900 horizon_v2 efficiency_v2
          seed_replication scale_status
      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            artifacts/figures/*.png
            artifacts/figures/*.pdf
            artifacts/figures/*.json
          if-no-files-found: error

  latex:
    needs: figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated paper figures
        uses: actions/download-artifact@v4
        with:
          name: paper-figures
          path: artifacts/figures
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Compile living manuscript
        working-directory: docs/paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex
      - name: Compile focused technical report
        working-directory: docs/paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error astro_technical_report.tex
      - name: Upload compiled papers
        uses: actions/upload-artifact@v4
        with:
          name: astro-paper-pdf
          path: |
            docs/paper/paper.pdf
            docs/paper/astro_technical_report.pdf
          if-no-files-found: error
