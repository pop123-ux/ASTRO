name: Paper checks

on:
  push:
    paths:
      - ".github/workflows/paper.yml"
      - "artifacts/**"
      - "docs/paper/**"
      - "docs/FIGURES.md"
      - "docs/PAPER_WORKFLOW.md"
      - "scripts/figures/**"
      - "scripts/paper/**"
      - "tests/test_paper_figures.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/paper.yml"
      - "artifacts/**"
      - "docs/paper/**"
      - "scripts/figures/**"
      - "scripts/paper/**"
      - "tests/test_paper_figures.py"
      - "pyproject.toml"

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight paper test dependencies
        run: pip install pytest matplotlib numpy
      - name: Syntax check
        run: python -m compileall -q scripts tests
      - name: Paper-facing tests
        run: pytest tests/test_paper_figures.py
      - name: Render current paper figures
        run: >-
          python scripts/figures/make_all.py --only
          optimizer_journey horizon_v2 efficiency_v2 leverage quintic
      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            artifacts/figures/*.png
            artifacts/figures/*.pdf
            artifacts/figures/*.json
          if-no-files-found: error
